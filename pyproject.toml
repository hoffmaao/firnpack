[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firnpack"
version = "0.1.0"
description = "FirnGrain: a 1D firn densification, thermal, and accumulation inverse model in Firedrake"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Andrew Hoffman", email = "ah301@rice.edu"},
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# Firedrake / PETSc / pyadjoint are provided by the Firedrake environment
# (see requirements.txt); listed here for documentation, not resolved by pip.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running end-to-end tests (deselect with '-m \"not slow\"')",
]
