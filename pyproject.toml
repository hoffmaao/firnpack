[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firn"
version = "0.1.0"
description = "FirnGrain: a 1D firn densification, thermal, and accumulation inverse model in Firedrake"
requires-python = ">=3.10"
# Firedrake / PETSc / pyadjoint are provided by the Firedrake environment
# (see requirements.txt); listed here for documentation, not resolved by pip.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end tests (deselect with '-m \"not slow\"')",
]
